<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <g transform="translate(10, 10)">
    <!-- Lithium-Ion Battery Recycle Emblem -->
    <rect x="8" y="8" width="64" height="64" rx="16" fill="#059669" />
    <!-- Battery Body -->
    <rect x="24" y="24" width="32" height="36" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 34 20 L 46 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Lightning Bolt / Energy Icon -->
    <path d="M 42 28 L 34 42 L 40 42 L 36 54 L 46 40 L 40 40 Z" fill="#FACC15" />
  </g>
  <!-- Text -->
  <text x="96" y="44" font-family="'Inter', 'Outfit', sans-serif" font-weight="900" font-size="22" fill="#0F172A" letter-spacing="0.5">Li-Ion Tech</text>
  <text x="96" y="64" font-family="'Inter', 'Outfit', sans-serif" font-weight="700" font-size="12" fill="#059669" letter-spacing="0.5">RECYCLING PARTNER</text>
  <text x="96" y="80" font-family="'Inter', 'Outfit', sans-serif" font-weight="500" font-size="10" fill="#64748B">Advanced Battery Extraction</text>
</svg>
